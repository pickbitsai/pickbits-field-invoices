<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#195b49">
  <meta name="description" content="Offline customers, visits and invoices. Your business, on your device.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>PickBits Field Invoices</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./app/styles.css">
  <script defer src="./app/core.js"></script>
  <script defer src="./app/storage.js"></script>
  <script defer src="./app/backup.js"></script>
  <script defer src="./app/renderers.js"></script>
  <script defer src="./app/demo.js"></script>
  <script defer src="./app/ui.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="demoBanner" hidden>DEMO · Fictional business and customers · Separate from your real data <button data-action="reset-demo">Reset demo</button></div>
  <div class="shell">
    <aside>
      <a class="brand" href="./"><img src="./icons/icon.svg" alt="" width="40" height="40"><span>PickBits<strong>Field Invoices</strong></span></a>
      <div class="workspace"><span class="eyebrow">YOUR BUSINESS</span><strong id="businessName">Getting ready…</strong></div>
      <nav aria-label="Main navigation">
        <button data-screen="home"><span aria-hidden="true">◷</span> Today</button>
        <button data-screen="visit"><span aria-hidden="true">＋</span> Visit</button>
        <button data-screen="customers"><span aria-hidden="true">♧</span> Customers</button>
        <button data-screen="history"><span aria-hidden="true">▤</span> History</button>
        <button data-screen="more" class="nav-more"><span aria-hidden="true">•••</span> More</button>
        <button data-screen="reports" class="nav-secondary"><span aria-hidden="true">▥</span> Reports</button>
        <button data-screen="catalogue" class="nav-secondary"><span aria-hidden="true">☷</span> Catalogue</button>
        <button data-screen="settings" class="nav-secondary"><span aria-hidden="true">⚙</span> Settings</button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span id="connection">On this device</span><small>Version 0.1.0 · No account needed</small></div>
    </aside>
    <main id="main" tabindex="-1"><p class="loading">Opening your field notebook…</p></main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="error" role="alert" hidden></div>
  <div id="printArea"></div>
  <footer class="app-footer">Made with PickBits Field Invoices</footer>
  <noscript>This app needs JavaScript to store customers and create invoices on your device.</noscript>
</body>
</html>
